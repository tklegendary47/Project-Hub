<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Beacon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      Beacon
    </a>
    <nav class="nav-links">
      <a href="index.html#product">Product</a>
      <a href="index.html#pricing">Pricing</a>
    </nav>
    <div class="nav-cta">
      <a href="signup.html" class="btn btn-ghost">Create account</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <span class="auth-eyebrow">Welcome back</span>
    <h1 class="auth-title">Log in to Beacon.</h1>
    <p class="auth-sub">See what changed since your last visit.</p>

    <div class="form-error" id="formError"></div>
    <div class="conn-banner" id="connBanner"></div>

    <form id="loginForm">
      <div class="field-group">
        <label class="field-label" for="email">Email address</label>
        <input class="field-input" type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-glow auth-submit" id="submitBtn">Log in</button>
    </form>

    <p class="auth-switch">New to Beacon? <a href="signup.html">Create an account</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
