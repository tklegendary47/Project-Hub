<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connect your website — Beacon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      Beacon
    </a>
    <div class="nav-cta">
      <a href="#" class="btn btn-ghost" id="logoutLink">Log out</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card onboarding-card">
    <div class="onboarding-steps">
      <span class="onboarding-step-dot onboarding-step-dot--active"></span>
      <span class="onboarding-step-dot"></span>
    </div>
    <span class="auth-eyebrow">Step 1 of 1</span>
    <h1 class="auth-title">Connect your website.</h1>
    <p class="auth-sub">Beacon uses this to build the first set of AI prompts to check you against.</p>

    <div class="form-error" id="formError"></div>

    <form id="onboardingForm">
      <div class="field-group">
        <label class="field-label" for="domain">Website domain</label>
        <input class="field-input" type="text" id="domain" name="domain" placeholder="yourbusiness.com" required />
      </div>
      <div class="field-group">
        <label class="field-label" for="displayName">What should we call it?</label>
        <input class="field-input" type="text" id="displayName" name="displayName" placeholder="Your Business Name" />
      </div>
      <div class="field-group">
        <label class="field-label" for="category">What do you sell or offer?</label>
        <input class="field-input" type="text" id="category" name="category" placeholder="e.g. e-commerce, web design agency, restaurant" required />
      </div>
      <div class="field-group">
        <label class="field-label" for="location">Where are your customers?</label>
        <input class="field-input" type="text" id="location" name="location" placeholder="e.g. Lagos, Nigeria" required />
      </div>
      <button type="submit" class="btn btn-glow auth-submit" id="submitBtn">Connect website</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/onboarding.js"></script>
</body>
</html>
