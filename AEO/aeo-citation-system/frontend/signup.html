<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your account — Beacon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      Beacon
    </a>
    <nav class="nav-links">
      <a href="index.html#product">Product</a>
      <a href="index.html#pricing">Pricing</a>
    </nav>
    <div class="nav-cta">
      <a href="login.html" class="btn btn-ghost">Log in</a>
    </div>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <span class="auth-eyebrow">Create your account</span>
    <h1 class="auth-title">Let's find out where you stand.</h1>
    <p class="auth-sub">Takes about a minute. No card required to create your account.</p>

    <div class="form-error" id="formError"></div>

    <form id="signupForm">
      <div class="field-group">
        <label class="field-label" for="name">Your name</label>
        <input class="field-input" type="text" id="name" name="name" required autocomplete="name" />
      </div>
      <div class="field-group">
        <label class="field-label" for="businessName">Business name</label>
        <input class="field-input" type="text" id="businessName" name="businessName" placeholder="Optional — you can add this later" autocomplete="organization" />
      </div>
      <div class="field-group">
        <label class="field-label" for="email">Email address</label>
        <input class="field-input" type="email" id="email" name="email" required autocomplete="email" />
      </div>
      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password" />
        <p class="field-hint">At least 8 characters.</p>
      </div>
      <button type="submit" class="btn btn-glow auth-submit" id="submitBtn">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
